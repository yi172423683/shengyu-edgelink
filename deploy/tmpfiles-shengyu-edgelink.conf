# 运行时目录：套接字都放在这里，两个服务共用。
#
# 为什么用 tmpfiles.d 而不是 systemd 的 RuntimeDirectory：
#   RuntimeDirectory 的生命周期绑定到**声明它的那个服务**。转发内核与管理面都要
#   往 /run/shengyu-edgelink 里放套接字（HAProxy 放统计套接字、管理面放日志接收套接字），
#   若两个 unit 都声明它，任一方重启都会把目录删掉重建，
#   顺手删掉另一方的套接字 —— 表现为"另一个服务莫名其妙读不到统计/收不到日志"。
#   tmpfiles.d 把目录归属交给系统，两个服务对等使用，重启互不影响。
#
# 权限 0770 + 属组 shengyu：
#   管理面以 shengyu 身份运行，需要**读** HAProxy 的统计套接字（发布验证要用），
#   也需要**写**自己的日志接收套接字。两组权限都在这里一次性讲清楚，
#   而不是靠两边各自 chmod 去猜（评审 F03）。
d /run/shengyu-edgelink 0770 root shengyu -
