# shengyu 节点内核参数。
#
# 中转平台的两个典型瓶颈都在内核默认值上，而不是在 HAProxy 配置里：
#   1. 单机几十万并发连接时，backlog 与本地端口范围会先于 CPU 到顶；
#   2. 长连接业务对 TIME_WAIT 的回收速度很敏感。
#
# 这里只调这三项，且都用**保守值**：调大是安全的，调错方向才会出事。
# 不在这里关 conntrack、不改 rp_filter —— 那些会影响同机上别的服务，
# 而本平台的设计前提是"不打扰既有服务"。

# 监听队列上限。默认 4096，高并发建连时会出现 SYN 丢弃（表现为客户端偶发连接超时，
# 而 HAProxy 侧只看到"客户端没来"，这是最难查的一类现象之一）。
net.core.somaxconn = 65535

# 半开连接队列。与 somaxconn 配套。
net.ipv4.tcp_max_syn_backlog = 65535

# 本地端口范围：转发节点每条到源站的连接都占一个本地端口。
# 默认 32768-60999 只有约 2.8 万个端口，是"连接数上不去"最常见的原因。
net.ipv4.ip_local_port_range = 10240 65535

# TIME_WAIT 可复用（默认已开，这里显式写出来，避免被别的 sysctl 文件覆盖成 0）。
net.ipv4.tcp_tw_reuse = 1

# 文件描述符上限。HAProxy 与平台都能到几十万，取决于 LimitNOFILE 与这里的配合。
fs.file-max = 2097152
